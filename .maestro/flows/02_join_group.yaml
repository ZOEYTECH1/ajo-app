# E2E — Join a group via invite code
# Verifies that a user can enter a group admin's invite code and send a join request.
#
# Usage:
#   maestro test .maestro/flows/02_join_group.yaml
#
# Prerequisites:
#   - Logged-in session (run 01_login.yaml first or use a persistent app state)
#   - A known invite code for an existing test group (groups are private —
#     there is no public search/discovery; invite code is the only way in)

appId: com.ajo.app
---
- launchApp

- waitForAnimationToEnd

# Home screen — tap the "Join an Ajo Group" entry point
- tapOn:
    text: "Join an Ajo Group"

- assertVisible:
    text: "Enter invite code"

- tapOn:
    text: "e.g. AJO4X7K2"
- inputText: "AJO4X7K2"

- tapOn:
    text: "Request to Join"

- waitForAnimationToEnd

# Confirm the pending state message
- assertVisible:
    text: "Request sent!"
